services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bridgepay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bridgepay_pgdata:/var/lib/postgresql/data
volumes:
  bridgepay_pgdata:
